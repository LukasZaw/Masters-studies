      function FizzBuzz() {
        for (let i = 1; i <= 100; i++) {
          if (i % 3 == 0 && i % 5 == 0) {
            console.log("FizzBuzz");
          }
          if (i % 3 == 0) {
            console.log("Fizz");
          } else if (i % 5 == 0) {
            console.log("Buzz");
          } else {
            console.log(i);
          }
        }
      }

      function triPascal(num) {
        if (num === 0) return [];

        let result = [];

        for (let row = 0; row < num; row++) {
          let arr = [];

          for (let col = 0; col <= row; col++) {
            if (col === 0 || col === row) {
              arr.push(1);
            } else {
              arr.push(result[row - 1][col - 1] + result[row - 1][col]);
            }
          }

          result.push(arr);
        }

        console.log(result);
      }

      function saper(board) {
        let result = [];

        for (let i = 0; i < board.length; i++) {
          let row = [];

          for (let j = 0; j < board[i].length; j++) {
            if (board[i][j] === "*") {
              row.push("*");
            } else {
              let count = 0;

              for (let di = -1; di <= 1; di++) {
                for (let dj = -1; dj <= 1; dj++) {
                  if (di === 0 && dj === 0) continue;
                  let ni = i + di;
                  let nj = j + dj;

                  if (
                    ni >= 0 &&
                    ni < board.length &&
                    nj >= 0 &&
                    nj < board[i].length
                  ) {
                    if (board[ni][nj] === "*") {
                      count++;
                    }
                  }

                  // sąsiad to (i + di, j + dj)
                }
              }

              row.push(count);
            }
          }
          result.push(row);
        }
        console.log(result);
      }

      const cache = {};

      function czyPierwsza(n) {
        if (cache[n] !== undefined) {
          console.log("Z cache:", n);
          return cache[n];
        }

        if (n < 2) {
          cache[n] = false;
          return false;
        }

        for (let i = 2; i <= Math.sqrt(n); i++) {
          if (n % i === 0) {
            cache[n] = false;
            return false;
          }
        }

        cache[n] = true;
        return true;
      }

      function wartoscReki(karty) {
        let suma = 0;
        let asy = 0;

        for (let karta of karty) {
          if (karta === "A") {
            suma += 11;
            asy++;
          } else if (karta === "W" || karta === "D" || karta === "K") {
            suma += 10;
          } else {
            suma += karta;
          }
        }

        while (suma > 21 && asy > 0) {
          suma -= 10;
          asy--;
        }

        if (suma > 21) {
          return "FURA";
        }

        return suma;
      }
